apiVersion: apps/v1
kind: Deployment

metadata:
  name: search-service
  namespaces: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: search-service

  template:
    metadata:
      labels:
        app: search-service

    spec:
      containers:
      - name: search-service
        image: praveen230389/search-service:latest

        ports:
        - containerPort: 3011

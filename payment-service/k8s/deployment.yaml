apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  namespaces: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
      - name: payment-service
        image: praveen230389/payment-service:latest

        ports:
        - containerPort: 3007

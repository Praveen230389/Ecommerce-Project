apiVersion: apps/v1
kind: Deployment

metadata:
  name: cart-service
  namespaces: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cart-service

  template:
    metadata:
      labels:
        app: cart-service

    spec:
      containers:
      - name: cart-service
        image: praveen230389/cart-service:latest

        ports:
        - containerPort: 3002

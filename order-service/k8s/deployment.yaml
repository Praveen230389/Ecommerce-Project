apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespaces: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
      - name: order-service
        image: praveen230389/order-service:latest

        ports:
        - containerPort: 3006

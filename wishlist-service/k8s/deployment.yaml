apiVersion: apps/v1
kind: Deployment

metadata:
  name: wishlist-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: wishlist-service

  template:
    metadata:
      labels:
        app: wishlist-service

    spec:
      containers:
      - name: wishlist-service
        image: praveen230389/wishlist-service:latest

        ports:
        - containerPort: 3014

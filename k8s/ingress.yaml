apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-alb-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  rules:
  - http:
      paths:
      # 1. API GATEWAY PATH (Main Entry point for the frontend)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80

      # 2. ANALYTICS SERVICE PATH
      - path: /api/analytics
        pathType: Prefix
        backend:
          service:
            name: analytics-service
            port:
              number: 80

      # 3. AUTH SERVICE PATH
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80

      # 4. CART SERVICE PATH
      - path: /api/cart
        pathType: Prefix
        backend:
          service:
            name: cart-service
            port:
              number: 80

      # 5. DISCOUNT SERVICE PATH
      - path: /api/discount
        pathType: Prefix
        backend:
          service:
            name: discount-service
            port:
              number: 80

      # 6. INVENTORY SERVICE PATH
      - path: /api/inventory
        pathType: Prefix
        backend:
          service:
            name: inventory-service
            port:
              number: 80

      # 7. NOTIFICATION SERVICE PATH
      - path: /api/notification
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 80

      # 8. ORDER SERVICE PATH
      - path: /api/order
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 80

      # 9. PAYMENT SERVICE PATH
      - path: /api/payment
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 80

      # 10. PRODUCT SERVICE PATH
      - path: /api/product
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 80

      # 11. RECOMMENDATION SERVICE PATH
      - path: /api/recommendation
        pathType: Prefix
        backend:
          service:
            name: recommendation-service
            port:
              number: 80

      # 12. REVIEW SERVICE PATH
      - path: /api/review
        pathType: Prefix
        backend:
          service:
            name: review-service
            port:
              number: 80

      # 13. SEARCH SERVICE PATH
      - path: /api/search
        pathType: Prefix
        backend:
          service:
            name: search-service
            port:
              number: 80

      # 14. SHIPPING SERVICE PATH
      - path: /api/shipping
        pathType: Prefix
        backend:
          service:
            name: shipping-service
            port:
              number: 80

      # 15. USER SERVICE PATH
      - path: /api/user
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 80

      # 16. WISHLIST SERVICE PATH
      - path: /api/wishlist
        pathType: Prefix
        backend:
          service:
            name: wishlist-service
            port:
              number: 80


              

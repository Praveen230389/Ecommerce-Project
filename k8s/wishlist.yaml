apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishlist-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wishlist-service
  template:
    metadata:
      labels:
        app: wishlist-service
    spec:
      containers:
      - name: wishlist-service
        image: praveen230389/wishlist-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3010
---
apiVersion: v1
kind: Service
metadata:
  name: wishlist-service
spec:
  selector:
    app: wishlist-service
  ports:
    - protocol: TCP
      port: 3010
      targetPort: 3010
  type: ClusterIP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: production  # रूट वाली फाइल्स प्रोडक्शन नेमस्पेस के लिए हैं!
  labels:
    app: api-gateway
spec:
  replicas: 1  # प्रॉडक्शन में लोड झेलने के लिए कम से कम 3 रेप्लिका
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        # यह Docker Hub के बजाय तुम्हारी AWS ECR रिपॉजिटरी से इमेज खींचेगा
        # जेनकिंस पाइपलाइन चलते समय इस 'latest' शब्द को असली प्रॉडक्शन टैग (जैसे prod-b12) से बदल देगी
        image: REPLACE_WITH_AWS_ECR_URL/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000  # हमारी प्रोडक्शन डॉकरफाइल का स्टैंडर्ड पोर्ट
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: production
spec:
  type: ClusterIP  # पूरी तरह सुरक्षित इंटरनल नेटवर्किंग
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000

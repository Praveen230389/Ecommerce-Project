# ==========================================
# 1. THE DEPLOYMENT CONFIGURATION (Pods)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${SERVICE_NAME}
  namespace: qa  # तुम्हारी टेस्टिंग ब्रांच के लिए QA एनवायरनमेंट
  labels:
    app: ${SERVICE_NAME}
spec:
  replicas: 1  # High Availability के लिए कम से कम 2 रेप्लिका कंपनियों का स्टैंडर्ड है
  strategy:
    type: RollingUpdate  # Zero-Downtime डिप्लॉयमेंट के लिए
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ${SERVICE_NAME}
  template:
    metadata:
      labels:
        app: ${SERVICE_NAME}
    spec:
      containers:
      - name: ${SERVICE_NAME}
        # जेनकिंस रनटाइम पर इस ${IMAGE_TAG} को AWS ECR के असली टैग से बदल देगा
        image: ${ECR_REGISTRY}/${SERVICE_NAME}:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080  # हमारी Dockerfile का इंटरनल पोर्ट 8080 था, तो कूबरनेटीस में भी यही रहेगा
        
        # इंटरव्यू बोनस: रिसोर्स लिमिट्स (इसके बिना इंटरव्यूअर रिजेक्ट कर देते हैं)
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "128Mi"

---
# ==========================================
# 2. THE SERVICE CONFIGURATION (Internal Network)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  namespace: qa
  labels:
    app: ${SERVICE_NAME}
spec:
  type: ClusterIP  # सुरक्षित इंटरनल नेटवर्किंग, यह बाहर इंटरनेट पर एक्सपोज्ड नहीं होगी
  selector:
    app: ${SERVICE_NAME}
  ports:
  - protocol: TCP
    port: 80        # बाहरी सर्विस पोर्ट
    targetPort: 8080 # हमारे कंटेनर का पोर्ट

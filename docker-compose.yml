    environment:
      - PORT=3007

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    ports:
      - "3008:3008"
    environment:
      - PORT=3008

  review-service:
    build:
      context: ./review-service
    container_name: review-service
    ports:
      - "3009:3009"
    environment:
      - PORT=3009

  wishlist-service:
    build:

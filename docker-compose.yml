version: '3.8'
services:
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - auth-service
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - inventory-service
      - notification-service
      - review-service
      - wishlist-service
      - search-service
      - shipping-service
      - recommendation-service
      - discount-service
      - analytics-service

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002

  product-service:
    build:
      context: ./product-service
    container_name: product-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003

  cart-service:
    build:
      context: ./cart-service
    container_name: cart-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    ports:
      - "3006:3006"
    environment:
      - PORT=3006

  inventory-service:
    build:
      context: ./inventory-service
    container_name: inventory-service

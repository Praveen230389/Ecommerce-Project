apiVersion: apps/v1
kind: Deployment

metadata:
  name: shipping-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shipping-service

  template:
    metadata:
      labels:
        app: shipping-service

    spec:
      containers:
      - name: shipping-service
        image: praveen230389/shipping-service:latest

        ports:
        - containerPort: 3012

apiVersion: apps/v1
kind: Deployment

metadata:
  name: notification-service
  namespaces: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
      - name: notification-service
        image: praveen230389/notification-service:latest

        ports:
        - containerPort: 3005

apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespaces: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
      - name: auth-service
        image: praveen230389/auth-service:latest

        ports:
        - containerPort: 3001
